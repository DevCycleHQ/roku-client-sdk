name: Lint BrightScript

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "20.10.0"
          cache: "yarn"
      - run: yarn install
      - run: yarn lint
