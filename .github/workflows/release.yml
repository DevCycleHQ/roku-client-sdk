name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Uses GITHUB_TOKEN, so CI does not run on the release PR by itself.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  upload-package:
    name: Build and upload package zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Run make bundle
        run: make bundle VERSION=${{ needs.release-please.outputs.version }}

      - name: Upload package.zip
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: package-${{ needs.release-please.outputs.version }}.zip

      - name: Attach package.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "package-${{ needs.release-please.outputs.version }}.zip" \
            --repo "${{ github.repository }}" --clobber
